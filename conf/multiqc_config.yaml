# ============================================================
# MultiQC Configuration for CUT&Tag Pipeline
# ============================================================

title: "CUT&Tag Pipeline QC Report"
subtitle: "Genomics Innovation Hub"
intro_text: "Quality control report for CUT&Tag paired-end sequencing data."

report_comment: >
    This report was generated by the CUT&Tag Nextflow DSL2 Pipeline.
    It includes raw QC, trimming, alignment, filtering, peak calling,
    FRiP scores, and TSS enrichment metrics.

# Show all samples by default
show_analysis_paths: true
show_log_level: true

# Custom section ordering
module_order:
    - fastqc:
        name: "FastQC (Raw)"
        path_filters:
            - "*_raw_fastqc.zip"
    - cutadapt
    - fastqc:
        name: "FastQC (Trimmed)"
        path_filters:
            - "*_trimmed_fastqc.zip"
    - bowtie2
    - samtools
    - picard
    - custom_content

# Custom content sections
custom_data:
    read_retention:
        id: "read_retention"
        section_name: "Read Retention Through Pipeline"
        description: "Number and percentage of reads retained at each filtering step."
        plot_type: "bargraph"
        pconfig:
            id: "read_retention_plot"
            title: "Read Retention"
            ylab: "Read Count"
            cpswitch_counts_label: "Number of Reads"
            stacking: "normal"

    frip_scores:
        id: "frip_scores"
        section_name: "FRiP Scores"
        description: "Fraction of Reads in Peaks (FRiP) per sample."
        plot_type: "bargraph"
        pconfig:
            id: "frip_plot"
            title: "FRiP Scores"
            ylab: "FRiP Score"
            ymax: 1.0
            ymin: 0.0

    peak_counts:
        id: "peak_counts"
        section_name: "Peak Counts"
        description: "Number of peaks called per sample and per merged group."
        plot_type: "bargraph"
        pconfig:
            id: "peak_count_plot"
            title: "Peak Counts"
            ylab: "Number of Peaks"

    mito_fraction:
        id: "mito_fraction"
        section_name: "Mitochondrial Read Fraction"
        description: "Percentage of reads mapping to mitochondrial chromosome."
        plot_type: "bargraph"
        pconfig:
            id: "mito_plot"
            title: "Mitochondrial Read Fraction"
            ylab: "% Reads"
            ymax: 100

    tss_enrichment:
        id: "tss_enrichment"
        section_name: "TSS Enrichment"
        description: "TSS enrichment scores per sample."
        plot_type: "bargraph"
        pconfig:
            id: "tss_enrich_plot"
            title: "TSS Enrichment Score"
            ylab: "Enrichment Score"

    annotation_dist:
        id: "annotation_dist"
        section_name: "Peak Annotation Distribution"
        description: "Distribution of peaks across genomic features."
        plot_type: "bargraph"
        pconfig:
            id: "annot_dist_plot"
            title: "Peak Annotation Distribution"
            ylab: "% Peaks"
            cpswitch_counts_label: "Number of Peaks"

# Table column customization
table_columns_visible:
    FastQC:
        percent_duplicates: true
        percent_gc: true
        avg_sequence_length: true
        total_sequences: true
    Cutadapt:
        percent_trimmed: true
    Samtools:
        flagstat_total: true
        mapped_passed: true
        properly_paired_passed: true
    Picard:
        PERCENT_DUPLICATION: true
        ESTIMATED_LIBRARY_SIZE: true

# Colour scheme
decimalPoint_format: "."
thousandsSep_format: ","

# Ignore certain file patterns
fn_ignore_files:
    - "*.bam"
    - "*.bai"
    - "*.fastq.gz"
    - "*.fq.gz"
    - "*.bigwig"
    - "*.bw"
    - "*.bedgraph"
    - "*.bg"
